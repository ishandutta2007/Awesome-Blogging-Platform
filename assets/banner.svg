<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#334155" opacity="0.5" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 54px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 20px;
      font-weight: 500;
      fill: #94a3b8;
      letter-spacing: -0.2px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
    }
    .dynamic-line {
      stroke-dasharray: 8 6;
      animation: dash 25s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -200;
      }
    }
  </style>

  <!-- Base background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Background Animated / Dynamic Glowing Orbs (placed strictly in background) -->
  <g opacity="0.7">
    <circle cx="180" cy="110" r="160" fill="url(#orbCyan)">
      <animate attributeName="cx" values="180;220;180" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="110;140;110" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="300" r="180" fill="url(#orbPurple)">
      <animate attributeName="cx" values="1020;980;1020" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="300;260;300" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="380" r="140" fill="url(#orbPink)">
      <animate attributeName="r" values="140;170;140" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Flow / Network Lines in the background -->
  <g opacity="0.35" class="dynamic-line">
    <path d="M 50,80 Q 300,10 600,80 T 1150,80" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 50,350 Q 350,420 700,350 T 1150,350" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <path d="M 150,210 L 1050,210" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- Feature Pills / Badges floating gently in lower-middle area -->
  <g transform="translate(180, 290)">
    <!-- Pill 1: Minimalist Blogging -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="18" cy="17" r="4.5" fill="#38bdf8" />
      <text x="32" y="22" fill="#e2e8f0" class="pill-text">Minimalist Markdown</text>
    </g>

    <!-- Pill 2: Open Source CMS -->
    <g transform="translate(196, 0)">
      <rect width="160" height="34" rx="17" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="18" cy="17" r="4.5" fill="#818cf8" />
      <text x="32" y="22" fill="#e2e8f0" class="pill-text">Open-Source CMS</text>
    </g>

    <!-- Pill 3: Static Site Generators -->
    <g transform="translate(372, 0)">
      <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
      <circle cx="18" cy="17" r="4.5" fill="#a855f7" />
      <text x="32" y="22" fill="#e2e8f0" class="pill-text">Static Site Engines</text>
    </g>

    <!-- Pill 4: Fediverse & Newsletters -->
    <g transform="translate(568, 0)">
      <rect width="265" height="34" rx="17" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2" opacity="0.9" />
      <circle cx="18" cy="17" r="4.5" fill="#f43f5e" />
      <text x="32" y="22" fill="#e2e8f0" class="pill-text">ActivityPub &amp; Newsletters</text>
    </g>
  </g>

  <!-- Foreground Main Content (Clear, crisp, unobscured) -->
  <g transform="translate(600, 120)" text-anchor="middle">
    <!-- Category Badge Above Title -->
    <rect x="-140" y="-36" width="280" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="0" y="-18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURATED ECOSYSTEM 2026</text>

    <!-- Title -->
    <text x="0" y="38" fill="url(#textGrad)" class="title" filter="url(#glow)">Awesome Blogging Platform</text>

    <!-- Subtitle -->
    <text x="0" y="84" class="subtitle">Curated Guide to Top SaaS Publishing Engines &amp; Open-Source Blogging Platforms</text>
    <text x="0" y="114" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500">Fast, minimalist, self-hosted, static-site, and federated tools for modern writers</text>
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="16" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />
</svg>
